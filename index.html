<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="creative-medium" content="mini-game">
<title>丑照合成大作战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    background: #0a0a0a;
    color: #f5f5f0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }

  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
    overflow-x: hidden;
  }
  #game-canvas {
    display: block;
    background: transparent;
  }

  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .hud-left { display: flex; gap: 10px; align-items: center; }

  .score-box {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    color: #f5f5f0;
    min-width: 60px;
  }
  .score-box .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    opacity: 0.5;
    margin-bottom: 2px;
    text-transform: uppercase;
  }
  .score-box .value {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .next-box {
    color: #f5f5f0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-right: 4px;
  }
  .next-box .label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    opacity: 0.5;
    text-transform: uppercase;
    order: 2;
  }
  .next-preview {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(245,245,240,0.25);
    background: #1a1a1a;
    order: 1;
  }
  .next-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .sound-btn {
    pointer-events: auto;
    background: transparent;
    border: 1px solid rgba(245,245,240,0.15);
    color: rgba(245,245,240,0.7);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .sound-btn:hover {
    border-color: rgba(245,245,240,0.3);
    color: #f5f5f0;
  }
  .sound-btn:active { opacity: 0.6; }

  #start-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    z-index: 100;
    padding: 20px;
    text-align: center;
  }
  #start-screen h1 {
    font-size: clamp(24px, 7vw, 34px);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #f5f5f0;
    margin-bottom: 10px;
    line-height: 1.2;
    max-width: 100%;
  }
  #start-screen .subtitle {
    color: rgba(245,245,240,0.5);
    font-size: clamp(12px, 3.5vw, 14px);
    font-weight: 400;
    margin-bottom: clamp(32px, 8vw, 48px);
    letter-spacing: 0.02em;
    max-width: 100%;
  }
  .photo-row {
    display: flex;
    align-items: center;
    gap: clamp(3px, 1.5vw, 10px);
    margin-bottom: clamp(40px, 10vw, 56px);
    flex-wrap: nowrap;
    justify-content: center;
    width: 100%;
    max-width: 100%;
    padding: 0 4px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .photo-row div.img-wrap {
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid rgba(245,245,240,0.2);
    background: #1a1a1a;
    flex-shrink: 0;
  }
  .photo-row div.img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .photo-row div.img-wrap.lvl-1 { width: clamp(16px, 5vw, 20px); height: clamp(16px, 5vw, 20px); }
  .photo-row div.img-wrap.lvl-2 { width: clamp(18px, 5.6vw, 24px); height: clamp(18px, 5.6vw, 24px); }
  .photo-row div.img-wrap.lvl-3 { width: clamp(20px, 6.2vw, 28px); height: clamp(20px, 6.2vw, 28px); }
  .photo-row div.img-wrap.lvl-4 { width: clamp(22px, 6.8vw, 32px); height: clamp(22px, 6.8vw, 32px); }
  .photo-row div.img-wrap.lvl-5 { width: clamp(26px, 7.8vw, 38px); height: clamp(26px, 7.8vw, 38px); }
  .photo-row div.img-wrap.lvl-6 { width: clamp(30px, 8.8vw, 44px); height: clamp(30px, 8.8vw, 44px); }
  .photo-row div.img-wrap.lvl-7 { width: clamp(36px, 10vw, 52px); height: clamp(36px, 10vw, 52px); }

  .photo-row .arrow {
    width: auto; height: auto; border: none; background: none;
    color: rgba(245,245,240,0.25);
    font-size: clamp(10px, 3vw, 14px);
    display: flex;
    align-items: center;
    flex-shrink: 0;
    line-height: 1;
  }

  #start-btn {
    background: #f5f5f0;
    color: #0a0a0a;
    border: none;
    padding: 14px clamp(40px, 14vw, 56px);
    font-size: clamp(13px, 3.5vw, 15px);
    font-weight: 500;
    letter-spacing: 0.05em;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
    max-width: 100%;
  }
  #start-btn:hover {
    background: #fff;
    transform: translateY(-1px);
  }
  #start-btn:active {
    transform: translateY(0);
    opacity: 0.85;
  }

  .rules {
    margin-top: clamp(32px, 8vw, 48px);
    color: rgba(245,245,240,0.4);
    font-size: 12px;
    line-height: 2;
    max-width: 280px;
    width: 100%;
    letter-spacing: 0.02em;
  }
  .rules strong {
    color: rgba(245,245,240,0.7);
    font-weight: 500;
  }

  #game-over-panel, #win-panel {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 50;
    padding: 20px;
  }
  #game-over-panel.show, #win-panel.show { display: flex; }

  .panel-card {
    background: #141414;
    border-radius: 20px;
    padding: 32px 28px;
    text-align: center;
    border: 1px solid rgba(245,245,240,0.08);
    max-width: 320px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .panel-card h2 {
    font-size: 22px;
    font-weight: 600;
    color: #f5f5f0;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .panel-card .panel-sub {
    color: rgba(245,245,240,0.45);
    font-size: 13px;
    margin-bottom: 24px;
    font-weight: 400;
  }
  .stat-row {
    display: flex;
    justify-content: space-around;
    margin-bottom: 28px;
    padding: 20px 0;
    border-top: 1px solid rgba(245,245,240,0.06);
    border-bottom: 1px solid rgba(245,245,240,0.06);
  }
  .stat-item { color: #f5f5f0; text-align: center; }
  .stat-item .stat-label {
    font-size: 11px;
    opacity: 0.4;
    margin-bottom: 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stat-item .stat-value {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .panel-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s ease;
    font-family: inherit;
    letter-spacing: 0.03em;
  }
  .panel-btn:active { transform: scale(0.98); }
  .btn-primary {
    background: #f5f5f0;
    color: #0a0a0a;
  }
  .btn-primary:hover { background: #fff; }
  .btn-secondary {
    background: transparent;
    color: rgba(245,245,240,0.7);
    border: 1px solid rgba(245,245,240,0.15);
  }
  .btn-secondary:hover {
    border-color: rgba(245,245,240,0.3);
    color: #f5f5f0;
  }

  #win-poster {
    background: #141414;
    border-radius: 20px;
    padding: 36px 28px 28px;
    margin-bottom: 20px;
    text-align: center;
    border: 1px solid rgba(245,245,240,0.08);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    position: relative;
    max-width: 320px;
    width: 100%;
  }
  .poster-title {
    font-size: 15px;
    font-weight: 500;
    color: rgba(245,245,240,0.5);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .poster-img-wrap {
    width: 160px;
    height: 160px;
    margin: 0 auto 24px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid rgba(245,245,240,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .poster-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .poster-msg {
    font-size: 18px;
    color: #f5f5f0;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .poster-score {
    font-size: 12px;
    color: rgba(245,245,240,0.4);
    margin-top: 10px;
    letter-spacing: 0.06em;
  }

  #fireworks-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    display: none;
  }
  #fireworks-canvas.show { display: block; }

  .danger-flash {
    animation: dangerFlash 0.6s ease-in-out infinite alternate;
  }
  @keyframes dangerFlash {
    from { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); }
    to { box-shadow: inset 0 1px 0 0 rgba(245,245,240,0.15); }
  }

  #toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.92);
    background: rgba(20,20,20,0.9);
    color: #f5f5f0;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
    z-index: 200;
    white-space: nowrap;
    border: 1px solid rgba(245,245,240,0.08);
    letter-spacing: 0.02em;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #share-modal {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10,10,10,0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 60;
    padding: 20px;
  }
  #share-modal.show { display: flex; }

  .share-card {
    background: #141414;
    border-radius: 20px;
    padding: 28px 24px 24px;
    text-align: center;
    border: 1px solid rgba(245,245,240,0.08);
    max-width: 320px;
    width: min(320px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    position: relative;
    box-sizing: border-box;
  }
  .share-card .share-title {
    font-size: 15px;
    font-weight: 500;
    color: #f5f5f0;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }
  .qr-wrap {
    width: 100%;
    max-width: 220px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 16px;
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .qr-wrap canvas, .qr-wrap img {
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: 100% !important;
    display: block;
  }
  .share-hint {
    font-size: 12px;
    color: rgba(245,245,240,0.45);
    letter-spacing: 0.04em;
    line-height: 1.6;
  }
  .share-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    color: rgba(245,245,240,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: all 0.2s ease;
    z-index: 2;
  }
  .share-close:hover {
    color: #f5f5f0;
    background: rgba(245,245,240,0.08);
  }

  .win-btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .win-btn-row .panel-btn { margin-top: 0; flex: 1; }

  #gallery-page {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    background: #0a0a0a;
    z-index: 200;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #gallery-page.show { display: flex; }

  .gallery-header {
    width: 100%;
    padding: 48px 24px 24px;
    text-align: center;
    flex-shrink: 0;
  }
  .gallery-header .gallery-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(245,245,240,0.35);
    margin-bottom: 10px;
  }
  .gallery-header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: #f5f5f0;
    margin-bottom: 6px;
  }
  .gallery-header .gallery-sub {
    font-size: 13px;
    color: rgba(245,245,240,0.45);
    letter-spacing: 0.02em;
  }

  .gallery-grid {
    width: 100%;
    max-width: 420px;
    padding: 20px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex-shrink: 0;
  }
  .gallery-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    background: #141414;
    border-radius: 16px;
    border: 1px solid rgba(245,245,240,0.06);
  }
  .gallery-item .g-img-wrap {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 1.5px solid rgba(245,245,240,0.12);
    background: #1a1a1a;
  }
  .gallery-item .g-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .gallery-item .g-info {
    flex: 1;
    min-width: 0;
  }
  .gallery-item .g-level {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(245,245,240,0.4);
    margin-bottom: 4px;
  }
  .gallery-item .g-desc {
    font-size: 14px;
    font-weight: 500;
    color: #f5f5f0;
    letter-spacing: -0.01em;
  }
  .gallery-item.lvl-7 .g-img-wrap {
    width: 64px;
    height: 64px;
    border-color: rgba(245,245,240,0.25);
  }
  .gallery-item.lvl-7 .g-level {
    color: rgba(245,245,240,0.7);
  }

  .gallery-footer {
    width: 100%;
    padding: 20px 24px 40px;
    text-align: center;
    flex-shrink: 0;
  }
  .gallery-footer .funny-line {
    font-size: 12px;
    color: rgba(245,245,240,0.35);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .gallery-play-btn {
    display: inline-block;
    background: #f5f5f0;
    color: #0a0a0a;
    border: none;
    padding: 12px 40px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .gallery-play-btn:hover {
    background: #fff;
    transform: translateY(-1px);
  }
  .gallery-play-btn:active {
    transform: translateY(0);
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game-canvas"></canvas>
  <canvas id="fireworks-canvas"></canvas>

  <div id="toast"></div>

  <div id="hud">
    <div class="hud-left">
      <div class="score-box">
        <div class="label">分数</div>
        <div class="value" id="score-val">0</div>
      </div>
      <button class="sound-btn" id="sound-btn" title="音效开关">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>
    </div>
    <div class="next-box">
      <div class="label">下一个</div>
      <div class="next-preview" id="next-preview">
        <img id="next-img" src="" alt="next">
      </div>
    </div>
  </div>

  <div id="start-screen">
    <h1>丑照合成大作战</h1>
    <p class="subtitle">相同的照片碰撞，会合成更丑的</p>
    <div class="photo-row" id="photo-row"></div>
    <button id="start-btn">开始游戏</button>
    <div class="rules">
      <p><strong>玩法</strong></p>
      <p>拖动小球左右移动，松手掉落<br>相同照片合成更高级别的照片<br>合成到第7级终极丑照即胜利</p>
    </div>
  </div>

  <div id="game-over-panel">
    <div class="panel-card">
      <h2>游戏结束</h2>
      <p class="panel-sub">球堆得太高了</p>
      <div class="stat-row">
        <div class="stat-item">
          <div class="stat-label">本局得分</div>
          <div class="stat-value" id="final-score">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">最高等级</div>
          <div class="stat-value" id="final-level">1</div>
        </div>
      </div>
      <button class="panel-btn btn-primary" id="restart-btn">再来一局</button>
    </div>
  </div>

  <div id="win-panel">
    <div id="win-poster">
      <div class="poster-title">终极丑照</div>
      <div class="poster-img-wrap">
        <img id="win-img" src="" alt="终极丑照">
      </div>
      <div class="poster-msg">你成功合成了<br>最高级别的丑照</div>
      <div class="poster-score" id="win-score">最终得分 0</div>
    </div>
    <div class="win-btn-row">
      <button class="panel-btn btn-primary" id="save-btn">保存</button>
      <button class="panel-btn btn-secondary" id="share-btn">分享</button>
    </div>
    <button class="panel-btn btn-secondary" id="win-restart-btn">再玩一次</button>
  </div>

  <div id="share-modal">
    <div class="share-card">
      <button class="share-close" id="share-close" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="share-title">分享给朋友</div>
      <div class="qr-wrap" id="qr-wrap"></div>
      <div class="share-hint">扫码查看全部丑照</div>
    </div>
  </div>

  <div id="gallery-page">
    <div class="gallery-header">
      <div class="gallery-eyebrow">Gallery</div>
      <h1>全部 7 级丑照</h1>
      <p class="gallery-sub">从最不丑到终极丑，挑战你的极限</p>

      <p class="funny-line">敢不敢亲自合成出终极丑照？</p>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
const LEVEL_IMAGES = [
  'https://aka.doubaocdn.com/s/tHThGlFdf6',
  'https://aka.doubaocdn.com/s/bbLtZS5mTR',
  'https://aka.doubaocdn.com/s/N154iMBFS0',
  'https://aka.doubaocdn.com/s/uy0o26Y0g7',
  'https://aka.doubaocdn.com/s/pPadV6siDs',
  'https://aka.doubaocdn.com/s/8HTzIRyD3I',
  'https://aka.doubaocdn.com/s/rd0uBTpMvN'
];

function getLevelRadius(level, gameW) {
  const level1Diameter = Math.max(80, gameW * 0.2);
  const diameterScales = [1, 1.22, 1.48, 1.78, 2.12, 2.5, 2.95];
  const diameter = level1Diameter * diameterScales[level];
  const maxDiameter = gameW * 0.75;
  return Math.min(diameter, maxDiameter) / 2;
}

const LEVEL_SCORES = [10, 30, 60, 100, 180, 300, 500];

const container = document.getElementById('game-container');
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const fwCanvas = document.getElementById('fireworks-canvas');
const fwCtx = fwCanvas.getContext('2d');
const scoreEl = document.getElementById('score-val');
const nextImgEl = document.getElementById('next-img');
const startScreen = document.getElementById('start-screen');
const gameOverPanel = document.getElementById('game-over-panel');
const winPanel = document.getElementById('win-panel');
const finalScoreEl = document.getElementById('final-score');
const finalLevelEl = document.getElementById('final-level');
const winScoreEl = document.getElementById('win-score');
const winImgEl = document.getElementById('win-img');
const soundBtn = document.getElementById('sound-btn');
const shareModal = document.getElementById('share-modal');
const shareCloseBtn = document.getElementById('share-close');
const shareBtn = document.getElementById('share-btn');
const qrWrap = document.getElementById('qr-wrap');
const galleryPage = document.getElementById('gallery-page');
const galleryGrid = document.getElementById('gallery-grid');
const galleryPlayBtn = document.getElementById('gallery-play-btn');

let gameW = 0, gameH = 0;
let wallThickness = 40;
let dangerY = 0;

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  let targetW, targetH;
  if (w / h < 9 / 16) {
    targetW = w;
    targetH = h;
  } else {
    targetW = h * 9 / 16;
    targetH = h;
  }
  if (targetW > 480) {
    targetW = 480;
    targetH = targetW * 16 / 9;
  }
  gameW = targetW;
  gameH = targetH;
  canvas.width = gameW * window.devicePixelRatio;
  canvas.height = gameH * window.devicePixelRatio;
  canvas.style.width = gameW + 'px';
  canvas.style.height = gameH + 'px';
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  fwCanvas.width = gameW * window.devicePixelRatio;
  fwCanvas.height = gameH * window.devicePixelRatio;
  fwCanvas.style.width = gameW + 'px';
  fwCanvas.style.height = gameH + 'px';
  fwCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  dangerY = gameH * 0.18;
  wallThickness = Math.max(30, gameW * 0.04);
  if (engine) {
    rebuildWalls();
  }
}

const { Engine, World, Bodies, Body, Events, Composite, Query } = Matter;

let engine, world;
let balls = [];
let walls = [];
let currentBall = null;
let nextBallLevel = 1;
let dropX = 0;
let canDrop = true;
let isDropping = false;
let score = 0;
let maxLevel = 0;
let gameState = 'menu';
let soundOn = true;
let dangerTimer = 0;
let gameOverTimer = 0;

const imgCache = {};
function loadImage(src) {
  return new Promise((resolve, reject) => {
    if (imgCache[src]) { resolve(imgCache[src]); return; }
    const img = new Image();
    img.onload = () => { imgCache[src] = img; resolve(img); };
    img.onerror = () => { resolve(null); };
    img.src = src;
  });
}

async function preloadImages() {
  for (let i = 0; i < LEVEL_IMAGES.length; i++) {
    await loadImage(LEVEL_IMAGES[i]);
  }
}

function initPhysics() {
  engine = Engine.create();
  engine.gravity.y = 1.2;
  world = engine.world;
  rebuildWalls();
  Events.on(engine, 'collisionStart', handleCollision);
}

function rebuildWalls() {
  walls.forEach(w => World.remove(world, w));
  walls = [];
  const bottomY = gameH - 20;
  const floor = Bodies.rectangle(gameW / 2, bottomY + wallThickness/2, gameW + wallThickness*2, wallThickness, {
    isStatic: true, restitution: 0.3, friction: 0.5, label: 'floor'
  });
  const leftWall = Bodies.rectangle(-wallThickness/2, gameH/2, wallThickness, gameH * 2, {
    isStatic: true, restitution: 0.3, friction: 0.5, label: 'wall'
  });
  const rightWall = Bodies.rectangle(gameW + wallThickness/2, gameH/2, wallThickness, gameH * 2, {
    isStatic: true, restitution: 0.3, friction: 0.5, label: 'wall'
  });
  walls.push(floor, leftWall, rightWall);
  World.add(world, walls);
}

function createBall(level, x, y, isStatic = false) {
  const radius = getLevelRadius(level, gameW);
  const body = Bodies.circle(x, y, radius, {
    restitution: 0.35, friction: 0.3, frictionAir: 0.005,
    density: 0.001 + level * 0.0002, isStatic: isStatic, label: 'ball-' + level
  });
  const ball = { body, level, radius, img: imgCache[LEVEL_IMAGES[level]], merging: false };
  balls.push(ball);
  World.add(world, body);
  return ball;
}

function spawnNextBall() {
  currentBall = {
    level: nextBallLevel,
    radius: getLevelRadius(nextBallLevel, gameW),
    img: imgCache[LEVEL_IMAGES[nextBallLevel]]
  };
  dropX = gameW / 2;
  nextBallLevel = Math.floor(Math.random() * 3);
  nextImgEl.src = LEVEL_IMAGES[nextBallLevel];
}

function dropBall() {
  if (!canDrop || !currentBall || isDropping) return;
  isDropping = true;
  canDrop = false;
  const radius = currentBall.radius;
  const level = currentBall.level;
  const y = dangerY - radius - 5;
  createBall(level, dropX, y, false);
  playDropSound(level);
  currentBall = null;
  setTimeout(() => {
    if (gameState === 'playing') {
      spawnNextBall();
      canDrop = true;
      isDropping = false;
    }
  }, 500);
}

let pendingMerges = [];

function handleCollision(event) {
  if (gameState !== 'playing') return;
  const pairs = event.pairs;
  for (let pair of pairs) {
    const a = pair.bodyA;
    const b = pair.bodyB;
    if (!a.label || !b.label) continue;
    if (!a.label.startsWith('ball-') || !b.label.startsWith('ball-')) continue;
    const levelA = parseInt(a.label.split('-')[1], 10);
    const levelB = parseInt(b.label.split('-')[1], 10);
    if (isNaN(levelA) || isNaN(levelB)) continue;
    if (levelA !== levelB) continue;
    if (levelA >= 6) continue;
    const ballA = balls.find(x => x.body === a);
    const ballB = balls.find(x => x.body === b);
    if (!ballA || !ballB) continue;
    if (ballA.merging || ballB.merging) continue;
    const idA = a.id, idB = b.id;
    const mergeKey = idA < idB ? idA + '-' + idB : idB + '-' + idA;
    if (pendingMerges.some(m => m.key === mergeKey)) continue;
    pendingMerges.push({ key: mergeKey, ballA, ballB, newLevel: levelA + 1 });
  }
}

function processMerges() {
  if (pendingMerges.length === 0) return;
  if (gameState !== 'playing') { pendingMerges = []; return; }
  const validMerges = [];
  const usedBodies = new Set();
  for (const m of pendingMerges) {
    const stillA = balls.includes(m.ballA) && !m.ballA.merging;
    const stillB = balls.includes(m.ballB) && !m.ballB.merging;
    if (!stillA || !stillB) continue;
    if (usedBodies.has(m.ballA.body.id) || usedBodies.has(m.ballB.body.id)) continue;
    usedBodies.add(m.ballA.body.id);
    usedBodies.add(m.ballB.body.id);
    validMerges.push(m);
  }
  pendingMerges = [];
  for (const m of validMerges) {
    doMerge(m.ballA, m.ballB, m.newLevel);
  }
}

function doMerge(ballA, ballB, newLevel) {
  ballA.merging = true;
  ballB.merging = true;
  const midX = (ballA.body.position.x + ballB.body.position.x) / 2;
  const midY = (ballA.body.position.y + ballB.body.position.y) / 2;
  const vxA = ballA.body.velocity.x;
  const vyA = ballA.body.velocity.y;
  const vxB = ballB.body.velocity.x;
  const vyB = ballB.body.velocity.y;
  Composite.remove(world, ballA.body);
  Composite.remove(world, ballB.body);
  balls = balls.filter(b => b !== ballA && b !== ballB);
  const addScore = LEVEL_SCORES[newLevel] || 100;
  score += addScore;
  scoreEl.textContent = score;
  if (newLevel > maxLevel) { maxLevel = newLevel; }
  createMergeEffect(midX, midY, newLevel);
  playMergeSound(newLevel);
  const newBall = createBall(newLevel, midX, midY, false);
  const newVx = (vxA + vxB) * 0.4;
  const newVy = Math.min((vyA + vyB) * 0.4, -2);
  Body.setVelocity(newBall.body, { x: newVx, y: newVy });
  if (newLevel >= 6) {
    setTimeout(() => { if (gameState === 'playing') { triggerWin(); } }, 600);
  }
}

let particles = [];
function createMergeEffect(x, y, level) {
  const count = 10 + level * 2;
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const speed = 2.5 + Math.random() * 3 + level * 0.3;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.5,
      life: 1, decay: 0.025 + Math.random() * 0.015, size: 2 + Math.random() * 3
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life * 0.7;
    ctx.fillStyle = '#f5f5f0';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.clearRect(0, 0, gameW, gameH);
  drawWalls();
  drawDangerLine();
  balls.forEach(ball => drawBall(ball));
  if (currentBall && canDrop) { drawDropBall(); }
  drawParticles();
}

function drawWalls() {
  const bottomY = gameH - 16;
  ctx.strokeStyle = 'rgba(245, 245, 240, 0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(12, bottomY);
  ctx.lineTo(gameW - 12, bottomY);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(245, 245, 240, 0.04)';
  ctx.beginPath();
  ctx.moveTo(6, dangerY);
  ctx.lineTo(6, bottomY);
  ctx.moveTo(gameW - 6, dangerY);
  ctx.lineTo(gameW - 6, bottomY);
  ctx.stroke();
}

function drawDangerLine() {
  const isDanger = checkDanger();
  ctx.strokeStyle = isDanger ? 'rgba(245, 245, 240, 0.45)' : 'rgba(245, 245, 240, 0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(12, dangerY);
  ctx.lineTo(gameW - 12, dangerY);
  ctx.stroke();
  ctx.setLineDash([]);
  if (isDanger) {
    ctx.fillStyle = 'rgba(245, 245, 240, 0.35)';
    ctx.font = '500 10px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('警戒线', 14, dangerY - 6);
  }
}

function drawBall(ball) {
  const { x, y } = ball.body.position;
  const r = ball.radius;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ball.body.angle);
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r - 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (ball.img && ball.img.complete && ball.img.naturalWidth > 0) {
    const imgW = ball.img.naturalWidth;
    const imgH = ball.img.naturalHeight;
    const imgRatio = imgW / imgH;
    const diameter = (r - 2) * 2;
    let drawW, drawH, drawX, drawY;
    if (imgRatio > 1) {
      drawH = diameter; drawW = diameter * imgRatio;
      drawX = -drawW / 2; drawY = -(r - 2);
    } else {
      drawW = diameter; drawH = diameter / imgRatio;
      drawX = -(r - 2); drawY = -drawH / 2;
    }
    ctx.drawImage(ball.img, drawX, drawY, drawW, drawH);
  } else {
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(-(r-2), -(r-2), (r-2)*2, (r-2)*2);
  }
  ctx.restore();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawDropBall() {
  const r = currentBall.radius;
  const y = dangerY - r - 10;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(dropX, y + r);
  ctx.lineTo(dropX, gameH - 20);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.save();
  ctx.translate(dropX, y);
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r - 2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();
  if (currentBall.img && currentBall.img.complete && currentBall.img.naturalWidth > 0) {
    const imgW = currentBall.img.naturalWidth;
    const imgH = currentBall.img.naturalHeight;
    const imgRatio = imgW / imgH;
    const diameter = (r - 2) * 2;
    let drawW, drawH, drawX, drawY;
    if (imgRatio > 1) {
      drawH = diameter; drawW = diameter * imgRatio;
      drawX = -drawW / 2; drawY = -(r - 2);
    } else {
      drawW = diameter; drawH = diameter / imgRatio;
      drawX = -(r - 2); drawY = -drawH / 2;
    }
    ctx.drawImage(currentBall.img, drawX, drawY, drawW, drawH);
  } else {
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(-(r-2), -(r-2), (r-2)*2, (r-2)*2);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function checkDanger() {
  for (let ball of balls) {
    if (!ball.body.isStatic && ball.body.position.y - ball.radius < dangerY) {
      const speed = Math.sqrt(ball.body.velocity.x ** 2 + ball.body.velocity.y ** 2);
      if (speed < 2) { return true; }
    }
  }
  return false;
}

function checkGameOver() {
  let overLineCount = 0;
  for (let ball of balls) {
    if (!ball.body.isStatic && ball.body.position.y - ball.radius < dangerY) {
      const speed = Math.sqrt(ball.body.velocity.x ** 2 + ball.body.velocity.y ** 2);
      if (speed < 1.5) { overLineCount++; }
    }
  }
  if (overLineCount > 0) {
    gameOverTimer++;
    if (gameOverTimer > 90) { triggerGameOver(); }
  } else {
    gameOverTimer = 0;
  }
}

let rafId = null;
function gameLoop() {
  if (gameState === 'playing') {
    Engine.update(engine, 1000 / 60);
    processMerges();
    updateParticles();
    checkGameOver();
    const isDanger = checkDanger();
    container.classList.toggle('danger-flash', isDanger && gameOverTimer > 30);
  }
  draw();
  rafId = requestAnimationFrame(gameLoop);
}

let isDragging = false;
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches && e.touches[0]) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches[0]) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return { x: clientX - rect.left, y: clientY - rect.top };
}
function handlePointerDown(e) {
  if (gameState !== 'playing') return;
  if (!canDrop || !currentBall) return;
  e.preventDefault();
  isDragging = true;
  const pos = getPos(e);
  updateDropX(pos.x);
}
function handlePointerMove(e) {
  if (!isDragging) return;
  e.preventDefault();
  const pos = getPos(e);
  updateDropX(pos.x);
}
function handlePointerUp(e) {
  if (!isDragging) return;
  e.preventDefault();
  isDragging = false;
  dropBall();
}
function updateDropX(x) {
  const r = currentBall ? currentBall.radius : 20;
  dropX = Math.max(r + 5, Math.min(gameW - r - 5, x));
}

function showToast(msg, duration = 2000) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { toast.classList.remove('show'); }, duration);
}

let audioCtx = null;
function initAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
}
function playTone(freq, duration, type = 'sine', vol = 0.2) {
  if (!soundOn || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function playDropSound(level) {
  const freqs = [300, 280, 260, 240, 220, 200, 180];
  playTone(freqs[level] || 250, 0.15, 'sine', 0.15);
}
function playMergeSound(level) {
  const baseFreq = 300 + level * 50;
  playTone(baseFreq, 0.1, 'sine', 0.2);
  setTimeout(() => playTone(baseFreq * 1.5, 0.15, 'sine', 0.18), 60);
}
function playWinSound() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => { setTimeout(() => playTone(f, 0.2, 'sine', 0.25), i * 120); });
  setTimeout(() => {
    playTone(523, 0.5, 'sine', 0.15);
    playTone(659, 0.5, 'sine', 0.15);
    playTone(784, 0.5, 'sine', 0.15);
  }, 500);
}
function playFailSound() {
  playTone(300, 0.2, 'sawtooth', 0.2);
  setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.2), 150);
  setTimeout(() => playTone(150, 0.4, 'sawtooth', 0.2), 350);
}

let fireworks = [];
let fwRafId = null;
function startFireworks() {
  fwCanvas.classList.add('show');
  fireworks = [];
  function launchFirework() {
    if (gameState !== 'win') return;
    const x = Math.random() * gameW;
    const y = gameH * 0.25 + Math.random() * gameH * 0.3;
    for (let i = 0; i < 24; i++) {
      const angle = (Math.PI * 2 * i) / 24 + Math.random() * 0.15;
      const speed = 2 + Math.random() * 2.5;
      fireworks.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.012 + Math.random() * 0.008, size: 1.5 + Math.random() * 1.5
      });
    }
    setTimeout(launchFirework, 700 + Math.random() * 600);
  }
  launchFirework();
  function animateFireworks() {
    fwCtx.clearRect(0, 0, gameW, gameH);
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const p = fireworks[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= p.decay;
      fwCtx.globalAlpha = p.life * 0.6;
      fwCtx.fillStyle = '#f5f5f0';
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      fwCtx.fill();
      if (p.life <= 0 || p.y > gameH) { fireworks.splice(i, 1); }
    }
    fwCtx.globalAlpha = 1;
    fwRafId = requestAnimationFrame(animateFireworks);
  }
  animateFireworks();
}
function stopFireworks() {
  fwCanvas.classList.remove('show');
  if (fwRafId) { cancelAnimationFrame(fwRafId); fwRafId = null; }
  fireworks = [];
}

function startGame() {
  balls.forEach(b => World.remove(world, b.body));
  balls = [];
  particles = [];
  score = 0;
  maxLevel = 0;
  scoreEl.textContent = '0';
  gameOverTimer = 0;
  gameState = 'playing';
  startScreen.style.display = 'none';
  gameOverPanel.classList.remove('show');
  winPanel.classList.remove('show');
  container.classList.remove('danger-flash');
  stopFireworks();
  nextBallLevel = Math.floor(Math.random() * 3);
  spawnNextBall();
  canDrop = true;
  isDropping = false;
  if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
}

function triggerGameOver() {
  if (gameState !== 'playing') return;
  gameState = 'gameover';
  playFailSound();
  try {
    const best = parseInt(localStorage.getItem('uglyMerge_best') || '0');
    if (score > best) { localStorage.setItem('uglyMerge_best', score); }
  } catch (e) {}
  finalScoreEl.textContent = score;
  finalLevelEl.textContent = 'Lv.' + (maxLevel + 1);
  gameOverPanel.classList.add('show');
}

function triggerWin() {
  if (gameState !== 'playing') return;
  gameState = 'win';
  playWinSound();
  try {
    const best = parseInt(localStorage.getItem('uglyMerge_best') || '0');
    if (score > best) { localStorage.setItem('uglyMerge_best', score); }
  } catch (e) {}
  winScoreEl.textContent = '最终得分：' + score;
  winImgEl.src = LEVEL_IMAGES[6];
  winPanel.classList.add('show');
  setTimeout(() => startFireworks(), 200);
}

function savePoster() {
  const posterCanvas = document.createElement('canvas');
  const w = 600, h = 800;
  posterCanvas.width = w;
  posterCanvas.height = h;
  const pctx = posterCanvas.getContext('2d');
  pctx.fillStyle = '#0f0f0f';
  pctx.fillRect(0, 0, w, h);
  pctx.fillStyle = 'rgba(245,245,240,0.4)';
  pctx.font = '500 12px -apple-system, "PingFang SC", sans-serif';
  pctx.textAlign = 'center';
  pctx.textBaseline = 'top';
  pctx.fillText('终 极 丑 照', w / 2, 60);
  const imgR = 140, imgCY = 280;
  pctx.shadowColor = 'rgba(0,0,0,0.6)';
  pctx.shadowBlur = 40;
  pctx.shadowOffsetY = 20;
  pctx.fillStyle = '#1a1a1a';
  pctx.beginPath();
  pctx.arc(w / 2, imgCY, imgR, 0, Math.PI * 2);
  pctx.fill();
  pctx.shadowColor = 'transparent';
  pctx.save();
  pctx.beginPath();
  pctx.arc(w / 2, imgCY, imgR - 2, 0, Math.PI * 2);
  pctx.closePath();
  pctx.clip();
  const img = imgCache[LEVEL_IMAGES[6]];
  if (img && img.complete && img.naturalWidth > 0) {
    const imgW = img.naturalWidth, imgH = img.naturalHeight;
    const imgRatio = imgW / imgH;
    const diameter = (imgR - 2) * 2;
    let dw, dh, dx, dy;
    if (imgRatio > 1) { dh = diameter; dw = diameter * imgRatio; }
    else { dw = diameter; dh = diameter / imgRatio; }
    dx = w / 2 - dw / 2; dy = imgCY - dh / 2;
    pctx.drawImage(img, dx, dy, dw, dh);
  }
  pctx.restore();
  pctx.strokeStyle = 'rgba(245,245,240,0.2)';
  pctx.lineWidth = 2;
  pctx.beginPath();
  pctx.arc(w / 2, imgCY, imgR - 1, 0, Math.PI * 2);
  pctx.stroke();
  pctx.fillStyle = '#f5f5f0';
  pctx.font = '600 28px -apple-system, "PingFang SC", sans-serif';
  pctx.fillText('你成功合成了', w / 2, 500);
  pctx.fillText('最高级别的丑照', w / 2, 545);
  pctx.strokeStyle = 'rgba(245,245,240,0.08)';
  pctx.lineWidth = 1;
  pctx.beginPath();
  pctx.moveTo(w / 2 - 80, 610);
  pctx.lineTo(w / 2 + 80, 610);
  pctx.stroke();
  pctx.fillStyle = 'rgba(245,245,240,0.5)';
  pctx.font = '400 14px -apple-system, "PingFang SC", sans-serif';
  pctx.fillText('最 终 得 分', w / 2 - 80, 640);
  pctx.fillText('最 高 等 级', w / 2 + 80, 640);
  pctx.fillStyle = '#f5f5f0';
  pctx.font = '600 26px -apple-system, "PingFang SC", sans-serif';
  pctx.fontVariantNumeric = 'tabular-nums';
  pctx.fillText(score, w / 2 - 80, 670);
  pctx.fillText('Lv.' + (maxLevel + 1), w / 2 + 80, 670);
  pctx.fillStyle = 'rgba(245,245,240,0.25)';
  pctx.font = '400 12px -apple-system, "PingFang SC", sans-serif';
  pctx.fillText('丑 照 合 成 大 作 战', w / 2, 740);
  try {
    const dataUrl = posterCanvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = '终极丑照_' + score + '分.png';
    link.href = dataUrl;
    link.click();
    showToast('海报已保存');
  } catch (e) {
    showToast('保存失败，请截屏保存');
  }
}

function initPhotoRow() {
  const row = document.getElementById('photo-row');
  for (let i = 0; i < LEVEL_IMAGES.length; i++) {
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '→';
      row.appendChild(arrow);
    }
    const div = document.createElement('div');
    div.className = 'img-wrap lvl-' + (i + 1);
    const img = document.createElement('img');
    img.src = LEVEL_IMAGES[i];
    div.appendChild(img);
    row.appendChild(div);
  }
}

function bindEvents() {
  canvas.addEventListener('mousedown', handlePointerDown);
  canvas.addEventListener('mousemove', handlePointerMove);
  canvas.addEventListener('mouseup', handlePointerUp);
  canvas.addEventListener('mouseleave', handlePointerUp);
  canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
  canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
  canvas.addEventListener('touchend', handlePointerUp, { passive: false });
  document.getElementById('start-btn').addEventListener('click', () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    startGame();
  });
  document.getElementById('restart-btn').addEventListener('click', startGame);
  document.getElementById('win-restart-btn').addEventListener('click', startGame);
  document.getElementById('save-btn').addEventListener('click', savePoster);
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    if (soundOn) {
      soundBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
    } else {
      soundBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';
    }
  });
  if (shareBtn) { shareBtn.addEventListener('click', openShareModal); }
  if (shareCloseBtn) { shareCloseBtn.addEventListener('click', closeShareModal); }
  if (shareModal) {
    shareModal.addEventListener('click', (e) => { if (e.target === shareModal) closeShareModal(); });
  }
  if (galleryPlayBtn) {
    galleryPlayBtn.addEventListener('click', () => {
      const url = new URL(window.location.href);
      url.searchParams.delete('view');
      window.location.href = url.toString();
    });
  }
  window.addEventListener('resize', () => { resize(); });
}

function initGallery() {
  galleryPage.classList.add('show');
  const descriptions = ['初见之丑','略有丑意','丑得明显','丑出层次','非常之丑','丑到离谱','终极丑照'];
  for (let i = 0; i < LEVEL_IMAGES.length; i++) {
    const item = document.createElement('div');
    item.className = 'gallery-item lvl-' + (i + 1);
    const imgWrap = document.createElement('div');
    imgWrap.className = 'g-img-wrap';
    const img = document.createElement('img');
    img.src = LEVEL_IMAGES[i];
    img.alt = '等级' + (i + 1);
    imgWrap.appendChild(img);
    const info = document.createElement('div');
    info.className = 'g-info';
    const level = document.createElement('div');
    level.className = 'g-level';
    level.textContent = i === 6 ? '等级 7  ·  终极' : '等级 ' + (i + 1);
    const desc = document.createElement('div');
    desc.className = 'g-desc';
    desc.textContent = descriptions[i];
    info.appendChild(level);
    info.appendChild(desc);
    item.appendChild(imgWrap);
    item.appendChild(info);
    galleryGrid.appendChild(item);
  }
}

function openShareModal() {
  shareModal.classList.add('show');
  generateQR();
}
function closeShareModal() {
  shareModal.classList.remove('show');
}
function generateQR() {
  if (!qrWrap || qrWrap.hasChildNodes()) return;
  const url = window.location.origin + window.location.pathname + '?view=gallery';
  if (typeof QRCode !== 'undefined') {
    try {
      const wrapWidth = qrWrap.clientWidth;
      const padding = 28;
      const qrSize = Math.max(120, Math.floor(wrapWidth - padding));
      QRCode.toCanvas(url, {
        width: qrSize, margin: 1,
        color: { dark: '#0a0a0a', light: '#ffffff' }
      }, function (error, canvas) {
        if (error) {
          qrWrap.innerHTML = '<span style="color:#999;font-size:12px;">二维码生成失败</span>';
          return;
        }
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        qrWrap.appendChild(canvas);
      });
    } catch (e) {
      qrWrap.innerHTML = '<span style="color:#999;font-size:12px;">二维码生成失败</span>';
    }
  } else {
    qrWrap.innerHTML = '<span style="color:#999;font-size:12px;">二维码加载中...</span>';
  }
}

async function init() {
  resize();
  initPhysics();
  initAudio();
  initPhotoRow();
  bindEvents();
  await preloadImages();
  gameLoop();
}

const isThumbnail = new URLSearchParams(window.location.search).has('thumbnail');
const urlParams = new URLSearchParams(window.location.search);
const isGallery = urlParams.get('view') === 'gallery';

if (isGallery) {
  resize();
  initGallery();
} else if (isThumbnail) {
  resize();
  initPhotoRow();
} else {
  init();
}
</script>
