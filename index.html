<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="creative-medium" content="mini-game">
    <title>合成帅哥</title>
    <script src="lib/matter.min.js?v=20260818c"></script>
    <script src="lib/jsmediatags.min.js?v=20260818c"></script>
    <link rel="stylesheet" href="css/style.css?v=20260821g">
</head>
<body>
    <div id="app">

        <!-- 关卡过渡遮罩 -->
        <div id="transition-overlay"></div>
        <!-- 图鉴图片预览 -->
        <div id="photo-preview" onclick="closePhotoPreview()">
            <div class="preview-img-wrap">
                <img id="previewImg" src="" alt="预览">
            </div>
            <div class="preview-info">
                <div class="preview-name" id="previewName"></div>
                <div class="preview-level" id="previewLevel"></div>
            </div>
        </div>

        <!-- 加载界面 -->
        <div id="loading" class="screen active">
            <div class="loading-content">
                <div class="loading-title">合成帅哥</div>
                <div class="loading-sub">一步步合成你的专属帅照</div>
                <div class="loading-spinner"></div>
                <div class="loading-bar-wrap">
                    <div class="loading-bar" id="loadingBar"></div>
                </div>
                <div class="loading-percent" id="loadingPercent">0%</div>
                <div class="loading-hint">
                    <span>⏳</span> 本网站使用 GitHub Pages 功能<br>
                    加载速度取决于您访问 GitHub 的速度
                </div>
            </div>
        </div>

        <!-- 主界面 -->
        <div id="home" class="screen">
            <div class="version-badge">v20260821g</div>
            <div class="game-title">合成帅哥</div>
            <div class="game-subtitle">一步步合成你的专属帅照</div>
            <div class="home-buttons">
                <button class="btn btn-primary" onclick="showScreen('levelSelect')">开玩</button>
                <button class="btn btn-ghost" onclick="showCollection()">图鉴</button>
            </div>
        </div>

        <!-- 关卡选择 -->
        <div id="levelSelect" class="screen">
            <div style="width:100%;max-width:400px;padding-top:60px;">
                <button class="icon-btn" onclick="showScreen('home')" style="margin-bottom:20px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="section-title">选择关卡</div>
            </div>
            <div class="level-list">
                <!-- 老马 -->
                <div class="level-card" onclick="startGame('ma')">
                    <div class="level-avatar"><img src="assets/images/ma4.jpg" alt="老马"></div>
                    <div class="level-info">
                        <div class="level-name">第一关 · 老马</div>
                        <div class="level-desc">经典老马，从小合到大</div>
                    </div>
                    <div class="level-arrow">→</div>
                </div>
                <!-- 老胖 -->
                <div class="level-card" onclick="startGame('pang')">
                    <div class="level-avatar"><img src="assets/images/pang4.jpg" alt="老胖"></div>
                    <div class="level-info">
                        <div class="level-name">第二关 · 老胖</div>
                        <div class="level-desc">老胖专属，越合越圆</div>
                    </div>
                    <div class="level-arrow">→</div>
                </div>
                <!-- 混合挑战（无鸡） -->
                <div class="level-card disabled" id="hiddenLevelCard" onclick="startGame('hidden')">
                    <div class="level-avatar" id="hiddenAvatar">🔒</div>
                    <div class="level-info">
                        <div class="level-name">第三关 · 混合挑战</div>
                        <div class="level-desc" id="hiddenLevelDesc">任意通关一人解锁</div>
                    </div>
                    <div class="level-arrow" id="hiddenArrow">🔒</div>
                </div>
                <!-- 鸡关卡（独立） -->
                <div class="level-card disabled" id="jiLevelCard" onclick="startGame('ji')">
                    <!-- 修改点：增加 id="jiImg" 和 id="jiLockOverlay"，图片默认隐藏，锁遮罩默认显示 -->
                    <div class="level-avatar" id="jiAvatar" style="position:relative; overflow:hidden; border-radius:50%;">
                        <img id="jiImg" src="assets/images/ji4.jpg" alt="鸡" style="width:100%; height:100%; object-fit:cover; display:none;">
                        <div id="jiLockOverlay" style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; pointer-events:none;">🔒</div>
                    </div>
                    <div class="level-info">
                        <div class="level-name">第四关 · 鸡</div>
                        <div class="level-desc" id="jiLevelDesc">任意通关一人解锁</div>
                    </div>
                    <div class="level-arrow" id="jiArrow">🔒</div>
                </div>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="game" class="screen">
            <canvas id="gameCanvas"></canvas>
            <div class="game-topbar">
                <button class="icon-btn" onclick="backToLevelSelect()" title="返回">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="score-box">
                    <div class="score-label">得分</div>
                    <div class="score-value" id="scoreValue">0</div>
                </div>
                <button class="icon-btn" id="soundBtn" onclick="toggleSound()" title="音效">
                    <svg id="soundOnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <svg id="soundOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
            </div>
            <div class="next-box">
                <div class="next-label">下一个</div>
                <div class="next-ball" id="nextBall"><img src="" id="nextBallImg" alt=""></div>
            </div>
            <div class="game-overlay" id="winOverlay">
                <div class="overlay-title">nice</div>
                <div class="final-photo"><img src="" id="winPhoto" alt="终极帅照"></div>
                <div class="overlay-score" id="winScore">0</div>
                <div class="overlay-buttons">
                    <button class="btn btn-primary" onclick="savePoster()">保存海报</button>
                    <button class="btn" onclick="restartGame()">再来一局</button>
                    <button class="btn btn-ghost" onclick="backToLevelSelect()">返回</button>
                </div>
            </div>
            <div class="game-overlay" id="loseOverlay">
                <div class="overlay-title">游戏结束</div>
                <div class="overlay-score" id="loseScore">0</div>
                <div style="color:#888;font-size:14px;">就这？再来一把</div>
                <div class="overlay-buttons">
                    <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
                    <button class="btn btn-ghost" onclick="backToLevelSelect()">返回</button>
                </div>
            </div>
        </div>

        <!-- 图鉴 -->
        <div id="collection" class="screen">
            <div class="collection-header">
                <button class="icon-btn" onclick="showScreen('home')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <div class="collection-title">图鉴</div>
            </div>
            <div class="tabs">
                <div class="tab-indicator" id="tabIndicator"></div>
                <div class="tab active" data-tab="ma" onclick="switchTab('ma')">老马</div>
                <div class="tab" data-tab="pang" onclick="switchTab('pang')">老胖</div>
                <div class="tab" data-tab="ji" onclick="switchTab('ji')">鸡</div>
            </div>
            <div class="collection-grid" id="collectionGrid"></div>
        </div>
    </div>

    <!-- 音乐播放器 -->
    <!-- 音乐列表面板 -->
    <div id="music-list-panel" onclick="if(event.target===this)toggleMusicList()">
        <div class="music-list-content">
            <div class="music-list-header">
                <span>播放列表</span>
            </div>
            <div class="music-tabs" id="musicTabs">
                <div class="tab-indicator" id="musicTabIndicator"></div>
                <div class="music-tab active" data-tab="online" onclick="switchMusicTab('online')">在线</div>
                <div class="music-tab" data-tab="local" onclick="switchMusicTab('local')">本地</div>
            </div>
            <div class="music-list-grid" id="musicListGrid"></div>
            <div class="music-add-btn" id="musicAddBtn" onclick="document.getElementById('localMusicInput').click()">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
                添加本地歌曲
            </div>
            <input type="file" id="localMusicInput" accept=".mp3,.wav,.ogg,.flac,.m4a,.aac,audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/mp4,audio/aac,audio/x-flac" multiple style="display:none" onchange="addLocalSongs(this.files);this.value=''">
        </div>
    </div>

    <!-- 音乐播放器 -->
    <div id="music-player" onclick="if(event.target===this||event.target.closest('.music-info'))toggleMusicList()">
        <div class="music-cover">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="music-info">
            <div class="music-title" id="musicTitle">未播放</div>
            <div class="music-artist" id="musicArtist"></div>
        </div>
        <div class="music-controls">
            <button class="music-btn" onclick="event.stopPropagation();prevMusic()" title="上一首">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="music-btn play-btn" id="musicPlayBtn" onclick="event.stopPropagation();toggleMusic()" title="播放/暂停">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="music-btn" onclick="event.stopPropagation();nextMusic()" title="下一首">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>
    </div>

    <script src="js/game.js?v=20260821g"></script>
</body>
</html>
